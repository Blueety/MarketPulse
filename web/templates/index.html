<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MarketPulse 市场看板</title>
<script>
  (function () {
    try {
      if (localStorage.getItem("mp-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          onerror="window.__chartFailed=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"
          onerror="window.__zoomFailed=true"></script>
</head>
<body>
  <header class="topbar">
      <button id="menu-toggle" type="button" class="icon-btn" title="菜单">☰</button>
    <div class="brand">
      <span class="brand-logo">M</span>
      <span class="brand-mark">MARKETPULSE</span>
      <span class="brand-sub">市场看板</span>
    </div>
    <div class="topbar-right">
      <span class="subdate" id="overview-date"></span>
      <button id="refresh-btn" type="button" class="icon-btn" title="刷新数据"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg></button>
    </div>
  </header>
  <div class="shell">
    <aside id="sidebar">
      <nav class="nav">
        <a class="nav-item active" href="#overview" data-target="overview"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>市场概览</span></a>
        <a class="nav-item" href="#watchlist-section" data-target="watchlist-section"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9L4.4 13.8l.7-4L2.2 6.2l4-.6z"/></svg><span>自选列表</span></a>
        <a class="nav-item disabled" href="#" data-disabled="1"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M5 6h6M5 9h6M5 12h4"/></svg><span>新闻资讯</span></a>
        <a class="nav-item disabled" href="#" data-disabled="1"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 14V8M8 14V4M13 14v-4"/></svg><span>宏观数据</span></a>
        <a class="nav-item disabled" href="#" data-disabled="1"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3" width="11" height="11" rx="1"/><path d="M2.5 6.5h11M5.5 2v2M10.5 2v2"/></svg><span>市场日历</span></a>
        <a class="nav-item disabled" href="#" data-disabled="1"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1"/></svg><span>设置</span></a>
      </nav>
      <div class="sidebar-footer">
        <button id="sidebar-theme" type="button" class="sidebar-theme-btn" title="切换主题"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"/></svg></button>
        <span class="sidebar-updated" id="sidebar-updated">更新 —</span>
      </div>
    </aside>
    <main class="main" id="main">
    <!-- 模块 1：市场概览 -->
    <div id="lede" class="lede" aria-label="今日状态"></div>
    <section class="card" id="overview">
      <h2>市场概览 <span class="h2-sub" id="overview-sub">· 最新交易日</span></h2>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>指数</th>
              <th class="th-sort num val" data-sort="value">收盘价 <span class="sort-ind"></span></th>
              <th class="th-sort num" data-sort="change_pct">涨跌幅 <span class="sort-ind"></span></th>
            </tr>
          </thead>
          <tbody id="overview-body">
            <tr><td colspan="3">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 模块 2：趋势图（4 组独立 y 轴） -->
    <section class="card" id="trend">
      <h2>近 <span id="range-label">30</span> 日趋势</h2>
      <div class="range-bar" id="range-bar">
        <button type="button" data-days="7">7天</button>
        <button type="button" data-days="30" class="active">30天</button>
        <button type="button" data-days="90">90天</button>
      </div>
      <div class="group-bar" id="group-bar"></div>
      <div class="symbol-filter" id="symbol-filter"></div>
      <div class="charts-grid" id="charts-grid">
        <div class="chart-box">
          <div class="chart-head"><h3>美股大盘</h3><div class="chart-meta" id="meta-gspc-ixic"></div></div>
          <canvas id="chart-gspc-ixic"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-head"><h3>A 股大盘</h3><div class="chart-meta" id="meta-sh-sz-cyb"></div></div>
          <canvas id="chart-sh-sz-cyb"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-head"><h3>波动率</h3><div class="chart-meta" id="meta-vix-vxn-move"></div></div>
          <canvas id="chart-vix-vxn-move"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-head"><h3>另类资产</h3><div class="chart-meta" id="meta-gld-btc"></div></div>
          <canvas id="chart-gld-btc"></canvas>
        </div>
      </div>
    </section>

    <!-- 模块 3：板块热度 -->
    <section class="card" id="sectors">
      <h2>A 股热点板块 <span class="h2-sub">· Top 5 领涨</span></h2>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr><th>板块</th><th>涨跌幅</th><th class="col-turnover">成交额</th><th>领涨股</th></tr>
          </thead>
          <tbody id="sector-body">
            <tr><td colspan="4">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 模块 5：自选股（config.json watchlist.stocks；空配置整卡隐藏） -->
    <section class="card hidden" id="watchlist-section">
      <h2>自选股 <span class="h2-sub">· config.json 配置 · 实时取数</span></h2>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>名称</th><th>当前价</th><th>涨跌幅</th><th>近30日趋势</th></tr></thead>
          <tbody id="watchlist-body"><tr><td colspan="4">加载中…</td></tr></tbody>
        </table>
      </div>
      <div class="chart-box">
              <div class="chart-head"><h3>近 30 日走势</h3><div class="chart-meta" id="meta-watchlist"></div></div>
              <canvas id="chart-watchlist"></canvas>
            </div>
    </section>


    <!-- 模块 4：告警记录 -->
    <section class="card" id="alerts">
      <h2>告警记录 <span class="h2-sub">· 最近 10 条</span></h2>
      <div id="alert-list" class="alert-list">
        <p class="empty">加载中…</p>
      </div>
    </section>
  </main>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
