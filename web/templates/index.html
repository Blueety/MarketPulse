<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MarketPulse 市场看板</title>
<script>
  (function () {
    try {
      if (localStorage.getItem("mp-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          onerror="window.__chartFailed=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"
          onerror="window.__zoomFailed=true"></script>
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" type="button" class="icon-btn" title="菜单">☰</button>
    <div class="brand">
      <span class="brand-logo">M</span>
      <span class="brand-mark">MarketPulse</span>
      <span class="brand-sub">市场看板</span>
    </div>
    <div class="topsearch is-placeholder" title="搜索（数据未接入）">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input type="search" placeholder="搜索指数 / 板块 / 标的" disabled aria-disabled="true">
    </div>
    <div class="topbar-right">
      <span class="date-chip" id="topbar-date">—</span>
      <button id="notify-btn" type="button" class="icon-btn is-placeholder" title="通知（数据未接入）" disabled><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6.5a4 4 0 1 1 8 0c0 3 1 4 1 4H3s1-1 1-4z"/><path d="M6.5 12.5a1.5 1.5 0 0 0 3 0"/></svg></button>
      <span class="avatar is-placeholder" title="账户（数据未接入）">MP</span>
      <button id="refresh-btn" type="button" class="icon-btn" title="刷新数据"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg></button>
    </div>
  </header>
  <div class="shell">
    <aside id="sidebar">
      <nav class="nav">
        <a class="nav-item active" href="#overview" data-target="overview"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>市场概览</span></a>
        <a class="nav-item" href="#trend" data-target="trend"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12l3.5-4 3 2.2L14 4"/><path d="M2 14h12"/></svg><span>市场趋势</span></a>
        <a class="nav-item" href="#sectors" data-target="sectors"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13V7M8 13V3M13 13v-3"/><path d="M2 14h12"/></svg><span>市场情绪</span></a>
        <a class="nav-item" href="#us-sectors" data-target="us-sectors"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h5M2 8h9M2 12h6"/></svg><span>板块表现</span></a>
        <a class="nav-item" href="#watchlist-section" data-target="watchlist-section"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9L4.4 13.8l.7-4L2.2 6.2l4-.6z"/></svg><span>自选列表</span></a>
        <a class="nav-item" href="#news" data-target="news"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 6h6M5 9h4"/></svg><span>新闻资讯</span></a>
        <a class="nav-item" href="#alerts" data-target="alerts"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l6 11H2z"/><path d="M8 6.5v3M8 11.2v.3"/></svg><span>告警记录</span></a>
        <div class="nav-divider"></div>
        <span class="nav-item is-disabled" title="未开放"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13V8M8 13V4M13 13v-6"/><path d="M2 14h12"/></svg><span>宏观数据</span></span>
        <span class="nav-item is-disabled" title="未开放"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3.5" width="12" height="10" rx="1.5"/><path d="M2 6.5h12M5.5 2v3M10.5 2v3"/></svg><span>市场日历</span></span>
        <span class="nav-item is-disabled" title="未开放"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg><span>设置</span></span>
      </nav>
      <div class="sidebar-footer">
        <button id="sidebar-theme" type="button" class="sidebar-theme-btn" title="切换主题"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"/></svg></button>
        <div class="market-status">
          <span class="ms-row"><i class="ms-dot" id="market-dot"></i><span id="market-status">市场状态 —</span></span>
          <span class="ms-time" id="market-time">北京时间 —</span>
        </div>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="dash">

        <!-- 行 1：4 张 KPI 卡（JS 渲染）+ 全球市场动态 promo（静态占位） -->
        <div class="row-kpi">
          <div id="lede" class="lede" aria-label="今日状态"></div>
          <section class="card promo" id="promo-global">
            <div class="promo-visual" aria-hidden="true">
              <svg viewBox="0 0 120 56" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="promoFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="rgba(255,255,255,.42)"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                  </linearGradient>
                </defs>
                <path d="M0 42L14 34L28 38L42 24L56 29L70 16L84 21L98 9L120 14L120 56L0 56Z" fill="url(#promoFill)"/>
                <path d="M0 42L14 34L28 38L42 24L56 29L70 16L84 21L98 9L120 14" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="promo-body">
              <h3>全球市场动态</h3>
              <p class="promo-note">数据未接入</p>
            </div>
          </section>
        </div>

        <!-- 行 2：市场趋势（四图合一 + 类别 tab）+ 自选列表（迷你条） -->
        <div class="row-main">
          <section class="card" id="trend">
            <div class="card-head">
              <h2>市场趋势 <span class="h2-sub" id="range-label">近 30 日</span></h2>
              <div class="seg" id="trend-tabs"></div>
              <div class="seg range-bar" id="range-bar">
                <button type="button" data-days="7">7D</button>
                <button type="button" data-days="30" class="active">30D</button>
                <button type="button" data-days="90">90D</button>
                <button type="button" data-days="365">1Y</button>
              </div>
            </div>
            <div class="chart-meta" id="trend-meta"></div>
            <div class="chart-wrap" id="chart-main-wrap">
              <canvas id="chart-main"></canvas>
            </div>
            <p class="empty chart-empty hidden" id="chart-main-empty"></p>
          </section>

          <section class="card hidden" id="watchlist-section">
            <h2>自选列表 <span class="h2-sub">· config.json 配置 · 实时取数</span></h2>
            <div class="table-scroll">
              <table class="data-table watchlist-table">
                <thead><tr><th class="col-ico"></th><th>名称</th><th class="num">现价</th><th class="num">涨跌幅</th><th class="col-bar"></th></tr></thead>
                <tbody id="watchlist-body"><tr><td colspan="5">加载中…</td></tr></tbody>
              </table>
            </div>
          </section>
        </div>

        <!-- 行 3：市场概览（6 小卡）+ 市场情绪 & 资金流向（3 子块）+ 行业板块表现（A股/美股 双 tab） -->
        <div class="row-3">
          <section class="card" id="overview">
            <h2>市场概览 <span class="h2-sub" id="overview-sub">· 最新交易日</span></h2>
            <div class="mini-grid" id="overview-body">
              <p class="empty">加载中…</p>
            </div>
          </section>

          <section class="card" id="sectors">
            <h2>市场情绪 &amp; 资金流向</h2>
            <div class="sub-block" id="risk-appetite" data-placeholder="1">
              <h3>风险偏好</h3>
              <div class="ph-body" id="risk-appetite-body"></div>
            </div>
            <div class="sub-block" id="fund-flow" data-placeholder="1">
              <h3>资金流向（近5日）</h3>
              <div class="ph-body" id="fund-flow-body"></div>
            </div>
            <div class="sub-block" id="market-relation">
              <h3>市场关系</h3>
              <div class="pill-row">
                <button type="button" class="pill" disabled>股指 vs 美债</button>
                <button type="button" class="pill" disabled>美元 vs 黄金</button>
                <button type="button" class="pill" disabled>VIX vs 股市</button>
                <button type="button" class="pill" disabled>原油 vs 经济</button>
              </div>
            </div>
          </section>

          <section class="card" id="us-sectors">
            <div class="card-head">
              <h2>行业板块表现</h2>
              <button type="button" class="link-btn" disabled title="数据未接入">查看全部 →</button>
            </div>
            <!-- 纯 CSS 双 tab ⚠️ 两个 radio 必须是 .tab-panels 的「前置同级兄弟」，`~` 才生效；
                 radio 也不能 display:none（会让 label 点击与键盘焦点一起失效）→ 绝对定位 + opacity:0 -->
            <input type="radio" name="sector-tab" id="sector-tab-cn" class="tab-radio" checked>
            <input type="radio" name="sector-tab" id="sector-tab-us" class="tab-radio">
            <div class="tab-labels">
              <label for="sector-tab-cn">A股</label>
              <label for="sector-tab-us">美股</label>
            </div>
            <div class="tab-panels">
              <div class="panel panel-cn">
                <div class="table-scroll">
                  <table class="data-table">
                    <thead>
                      <tr><th class="col-ico"></th><th>板块</th><th class="num">涨跌幅</th><th class="col-turnover">成交额</th><th>领涨股</th></tr>
                    </thead>
                    <tbody id="sector-body">
                      <tr><td colspan="5">加载中…</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <div class="panel panel-us">
                <div class="bar-list" id="us-sectors-body">
                  <p class="empty">加载中…</p>
                </div>
              </div>
            </div>
          </section>
        </div>

        <!-- 行 4：告警记录（窄）+ 最新资讯（宽）；资金流向/风险偏好已移入行 3 中卡作子块 -->
        <div class="row-news">
          <section class="card" id="alerts">
            <h2>告警记录 <span class="h2-sub">· 最近 10 条</span></h2>
            <div id="alert-list" class="alert-list">
              <p class="empty">加载中…</p>
            </div>
          </section>

          <section class="card" id="news" data-placeholder="1">
            <h2>最新资讯</h2>
            <div class="ph-body" id="news-body"></div>
          </section>
        </div>

      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
