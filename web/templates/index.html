<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MarketPulse 市场看板</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          onerror="window.__chartFailed=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"
          onerror="window.__zoomFailed=true"></script>
</head>
<body>
  <header class="topbar">
    <h1>MarketPulse 市场看板</h1>
    <span class="subdate" id="overview-date"></span>
  </header>

  <main class="container">
    <!-- 模块 1：市场概览 -->
    <section class="card">
      <h2>市场概览（最新交易日）</h2>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>指数</th>
              <th class="th-sort" data-sort="value">收盘 <span class="sort-ind"></span></th>
              <th class="th-sort" data-sort="change_pct">涨跌幅 <span class="sort-ind"></span></th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="overview-body">
            <tr><td colspan="4">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 模块 2：趋势图（4 组独立 y 轴） -->
    <section class="card">
      <h2>近 <span id="range-label">30</span> 日趋势</h2>
      <div class="range-bar" id="range-bar">
        <button type="button" data-days="7">7天</button>
        <button type="button" data-days="30" class="active">30天</button>
        <button type="button" data-days="90">90天</button>
      </div>
      <div class="group-bar" id="group-bar"></div>
      <div class="symbol-filter" id="symbol-filter"></div>
      <div class="charts-grid" id="charts-grid">
        <div class="chart-box">
          <div class="chart-head"><h3>美股大盘</h3><div class="chart-meta" id="meta-gspc-ixic"></div></div>
          <canvas id="chart-gspc-ixic"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-head"><h3>A 股大盘</h3><div class="chart-meta" id="meta-sh-sz-cyb"></div></div>
          <canvas id="chart-sh-sz-cyb"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-head"><h3>波动率</h3><div class="chart-meta" id="meta-vix-vxn-move"></div></div>
          <canvas id="chart-vix-vxn-move"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-head"><h3>另类资产</h3><div class="chart-meta" id="meta-gld-btc"></div></div>
          <canvas id="chart-gld-btc"></canvas>
        </div>
      </div>
    </section>

    <!-- 模块 3：板块热度 -->
    <section class="card">
      <h2>A 股热点板块 Top 5（领涨）</h2>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr><th>板块</th><th>涨跌幅</th><th>成交额</th><th>领涨股</th></tr>
          </thead>
          <tbody id="sector-body">
            <tr><td colspan="4">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 模块 4：告警记录 -->
    <section class="card">
      <h2>告警记录（最近 10 条）</h2>
      <div id="alert-list" class="alert-list">
        <p class="empty">加载中…</p>
      </div>
    </section>
  </main>

  <script>
    const COLORS = {
      gspc: "#58a6ff", ixic: "#3fb950", sh: "#f85149", sz: "#d29922",
      cyb: "#bc8cff", vix: "#f85149", vxn: "#d29922", move: "#bc8cff",
      gld: "#ffd700", btc: "#00d4ff"
    };
    const ALL_KEYS = Object.keys(COLORS);
    const SHORT = {
      gspc: "标普500", ixic: "纳指", sh: "上证", sz: "深证", cyb: "创业板",
      vix: "VIX", vxn: "VXN", move: "MOVE", gld: "黄金", btc: "比特币"
    };
    const GROUPS = [
      { id: "chart-gspc-ixic", name: "美股大盘", keys: ["gspc", "ixic"], type: "line" },
      { id: "chart-sh-sz-cyb", name: "A 股大盘", keys: ["sh", "sz", "cyb"], type: "line" },
      { id: "chart-vix-vxn-move", name: "波动率", keys: ["vix", "vxn", "move"], type: "line" },
      { id: "chart-gld-btc", name: "另类资产", keys: ["gld", "btc"], type: "line" },
    ];

    // 单一状态源：驱动所有视图刷新
    const state = {
      days: 30,
      selected: new Set(ALL_KEYS),
      sort: { key: null, dir: 1 },  // key: "value" | "change_pct"；dir: 1 升序 / -1 降序 / null 原序
      history: null,  // 最近一次 /api/history 全量 payload（显隐纯客户端管理）
      latest: null,   // 最近一次 /api/latest payload
      selSnapshot: null,  // 类别按钮点击前的选中快照（再次点击恢复）
    };
    const charts = {};  // group id -> Chart 实例（重渲染前 destroy）

    function fmtNum(v, digits) {
      if (v == null) return "—";
      return Number(v).toFixed(digits);
    }
    function fmtPct(v) {
      if (v == null) return "—";
      return (v >= 0 ? "+" : "") + Number(v).toFixed(2) + "%";
    }

    function buildQuery() {
      // 显隐改为纯客户端状态：恒返回全量 10 序列；symbols 参数保留向后兼容但前端不再使用
      return "/api/history?days=" + state.days;
    }

    function renderOverview(latest) {
      document.getElementById("overview-date").textContent = "数据截至：" + (latest.date || "");
      const tbody = document.getElementById("overview-body");
      tbody.innerHTML = "";
      if (!latest.indices || !latest.indices.length) {
        tbody.innerHTML = '<tr><td colspan="4">暂无数据</td></tr>';
        return;
      }
      // 按 selected 过滤（单一管线，图表与表格同步）
      let rows = latest.indices.filter(function (it) {
        return state.selected.has(it.symbol.toLowerCase());
      });
      // 排序（过滤之后执行）；null 恒排最后
      if (state.sort.key) {
        const k = state.sort.key;
        const dir = state.sort.dir;
        rows = rows.slice().sort(function (a, b) {
          const av = a[k], bv = b[k];
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          return (av - bv) * dir;
        });
      }
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="4">无选中指标</td></tr>';
        return;
      }
      section.style.display = "";
      rows.forEach(function (it) {
        const chg = it.change_pct;
        const cls = chg == null ? "" : (chg >= 0 ? "pos" : "neg");
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + it.label + "</td>" +
          "<td>" + fmtNum(it.value, 2) + "</td>" +
          '<td class="' + cls + '">' + fmtPct(chg) + "</td>" +
          "<td>" + (it.status || "—") + "</td>";
        tbody.appendChild(tr);
      });
      updateSortIndicators();
    }

    function renderSector(latest) {
      const tbody = document.getElementById("sector-body");
      tbody.innerHTML = "";
      const gainers = (latest.sector_heat && latest.sector_heat.gainers) || [];
      if (!gainers.length) {
        tbody.innerHTML = '<tr><td colspan="4">数据暂缺</td></tr>';
        return;
      }
      gainers.slice(0, 5).forEach(function (g) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + (g.name || "—") + "</td>" +
          '<td class="pos">' + fmtPct(g.change) + "</td>" +
          "<td>" + (g.turnover || "—") + "</td>" +
          "<td>" + (g.top_stock || "—") + "</td>";
        tbody.appendChild(tr);
      });
    }

    function renderAlerts(alerts) {
      const box = document.getElementById("alert-list");
      box.innerHTML = "";
      if (!alerts || !alerts.length) {
        box.innerHTML = '<p class="empty">暂无告警记录</p>';
        return;
      }
      alerts.forEach(function (a) {
        const level = a.level || "";
        const cls = level === "ALERT" ? "alert" : (level === "WARN" ? "warn" : "");
        const card = document.createElement("div");
        card.className = "alert-card " + cls;
        card.innerHTML =
          '<div class="alert-head"><span class="badge ' + cls + '">' + level + "</span>" +
          "<span>" + (a.symbol || "") + " · " + (a.date || "") + "</span></div>" +
          '<div class="alert-meta">类型：' + (a.type || "—") + " ｜ 市场状态：" + (a.state || "—") + "</div>" +
          '<div class="alert-row">当前值：' + fmtNum(a.current, 2) + " ｜ 昨日收盘：" + fmtNum(a.last, 2) +
          " ｜ 变化率：" + fmtPct(a.change_pct) + "（阈值 ±" + fmtNum(a.threshold, 1) + "%）</div>" +
          '<div class="alert-sugg">建议：' + (a.suggestion || "—") + "</div>" +
          '<div class="alert-report">相关报告：' + (a.report || "—") + "</div>";
        box.appendChild(card);
      });
    }

    function renderMeta(g, series) {
      const box = document.getElementById(g.id).parentElement;
      const el = box ? box.querySelector(".chart-meta") : null;
      if (!el) return;
      el.innerHTML = "";
      series.forEach(function (s) {
        const span = document.createElement("span");
        span.className = "meta-item";
        span.style.color = COLORS[s.key] || "#8b949e";
        span.textContent = s.label + " " + state.days + "D " + fmtPct(s.change_7d);
        el.appendChild(span);
      });
    }

    function renderLineChart(canvas, history, series) {
      const ctx = canvas.getContext("2d");

      const allDates = new Set();
      series.forEach(function (s) {
        (s.values || []).forEach(function (v, i) {
          if (v != null) allDates.add(history.dates[i]);
        });
      });
      const tradingDates = Array.from(allDates).filter(function (d) {
        var dt = new Date(d);
        return dt.getDay() !== 0 && dt.getDay() !== 6;
      }).sort();
      const dateIndexMap = {};
      tradingDates.forEach(function (d, i) { dateIndexMap[d] = i; });

      const datasets = series.map(function (s) {
        const pts = [];
        let lastVal = null;
        (s.values || []).forEach(function (v, i) {
          const date = history.dates[i];
          if (dateIndexMap[date] === undefined) return;
          if (v != null) {
            lastVal = v;
            pts.push({ x: date, y: v, rawVal: (s.raw ? s.raw[i] : null) });
          } else if (lastVal != null) {
            pts.push({ x: date, y: lastVal, rawVal: null });
          }
        });
        return {
          label: s.label,
          key: s.key,
          data: pts,
          borderColor: COLORS[s.key],
          backgroundColor: "transparent",
          fill: false,
          tension: 0.35,
          borderWidth: 2.5,
          pointRadius: function (c) { return c.dataIndex === c.dataset.data.length - 1 ? 3 : 0; },
          pointBackgroundColor: COLORS[s.key],
          pointBorderColor: "#fff",
          pointBorderWidth: 1.5,
          pointHitRadius: 10,
        };
      });

      const options = {
        responsive: true,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            display: true,
            labels: {
              color: "#8b949e",
              usePointStyle: true,
              boxWidth: 8,
              font: { size: 12 }
            },
            // 全权接管图例点击：仅改 state.selected，再统一 syncSelection（禁止默认 toggle，避免双写冲突）
            onClick: function (evt, legendItem, legend) {
              const chart = legend.chart;
              const ds = chart.data.datasets[legendItem.datasetIndex];
              if (!ds || ds.key == null) return;
              if (state.selected.has(ds.key)) state.selected.delete(ds.key);
              else state.selected.add(ds.key);
              syncSelection();
            }
          },
          tooltip: {
            enabled: !('ontouchstart' in window),  // 移动端禁用悬浮
            backgroundColor: "rgba(22, 27, 34, 0.95)",
            titleColor: "#e6edf3",
            bodyColor: "#e6edf3",
            borderColor: "#30363d",
            borderWidth: 1,
            titleFont: { size: 11 },
            bodyFont: { size: 12 },
            padding: 8,
            cornerRadius: 4,
            boxWidth: 8,
            callbacks: {
              title: function (items) { return items.length ? items[0].label : ""; },
              label: function (ctx) {
                const pt = ctx.dataset.data[ctx.dataIndex];
                const rv = pt && pt.rawVal != null ? pt.rawVal : null;
                return ctx.dataset.label + " " + fmtNum(rv, 2) + " (" + fmtPct(ctx.parsed.y - 100) + ")";
              }
            }
          }
        },
        scales: {
          x: {
            type: "category",
            labels: tradingDates,
            grid: { display: false },
            ticks: {
              font: { size: 12 },
              color: "#8b949e",
              maxRotation: 0,
              autoSkip: true,
              callback: function (value, index) { return String(tradingDates[index]).slice(8); }
            }
          },
          y: {
            grid: { color: "rgba(48, 54, 61, 0.25)" },
            border: { display: false },
            ticks: {
              font: { size: 12 },
              color: "#8b949e",
              callback: function (value) { return (value >= 100 ? "+" : "") + (value - 100).toFixed(1) + "%"; }
            }
          }
        },
        animation: { duration: 300, easing: "easeOutQuart" }
      };
      // 缩放/平移：仅当 zoom 插件可用时启用（CDN 失败则静默降级）
      if (window.ChartZoom && !window.__zoomFailed) {
        options.plugins.zoom = {
          wheel: { enabled: true, modifierKey: "ctrl" },
          pan: { enabled: true, modifierKey: "ctrl" },
          limits: { y: { min: "original", max: "original" } }
        };
      }
      return new Chart(canvas, { type: "line", data: { datasets: datasets }, options: options });
    }

    function renderBarChart(canvas, series) {
      const ctx = canvas.getContext("2d");
      const labels = [];
      const data = [];
      const bg = [];
      series.forEach(function (s) {
        if (s.change_7d == null) return;
        labels.push(SHORT[s.key] || s.label);
        data.push(s.change_7d);
        bg.push(s.change_7d >= 0 ? "#3fb950" : "#f85149");
      });
      const options = {
        indexAxis: "y",
        responsive: true,
        interaction: { mode: "nearest", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: true,
            backgroundColor: "rgba(22, 27, 34, 0.95)",
            titleColor: "#e6edf3",
            bodyColor: "#e6edf3",
            borderColor: "#30363d",
            borderWidth: 1,
            titleFont: { size: 11 },
            bodyFont: { size: 12 },
            padding: 8,
            cornerRadius: 4,
            callbacks: {
              label: function (ctx) { return state.days + "D 涨跌幅: " + fmtPct(ctx.parsed.x); }
            }
          }
        },
        scales: {
          x: {
            grid: { color: "rgba(48, 54, 61, 0.25)" },
            border: { display: false },
            ticks: {
              font: { size: 12 },
              color: "#8b949e",
              callback: function (value) { return (value >= 0 ? "+" : "") + value.toFixed(1) + "%"; }
            }
          },
          y: {
            grid: { display: false },
            ticks: { font: { size: 12 }, color: "#8b949e" }
          }
        },
        animation: { duration: 300, easing: "easeOutQuart" }
      };
      return new Chart(canvas, {
        type: "bar",
        data: { labels: labels, datasets: [{ data: data, backgroundColor: bg, borderRadius: 4, barThickness: 32 }] },
        options: options
      });
    }

    function renderGroup(g, history) {
      // 从零构建某组图表（首载 / 范围切换 / 空组恢复重建）；会 destroy 旧实例。
      // 显隐纯客户端：series 含该组全部序列，未选中者经 dataset.hidden 隐藏，图例项常驻可点回。
      const canvas = document.getElementById(g.id);
      const box = canvas.parentElement;
      const series = history.series.filter(function (s) {
        return g.keys.indexOf(s.key) !== -1;
      });
      const anySelected = series.some(function (s) { return state.selected.has(s.key); });
      if (charts[g.id]) { charts[g.id].destroy(); delete charts[g.id]; }
      let ph = box.querySelector(".chart-empty");
      if (!anySelected) {
        canvas.style.display = "none";
        if (!ph) {
          ph = document.createElement("p");
          ph.className = "empty chart-empty";
          ph.textContent = "无选中指标";
          box.appendChild(ph);
        }
        const meta = box.querySelector(".chart-meta");
        if (meta) meta.innerHTML = "";
        return;
      }
      if (ph) ph.remove();
      canvas.style.display = "";
      const chart = (g.type === "bar")
        ? renderBarChart(canvas, series)
        : renderLineChart(canvas, history, series);
      chart.data.datasets.forEach(function (ds) {
        if (!state.selected.has(ds.key)) ds.hidden = true;
      });
      chart.update();
      charts[g.id] = chart;
      renderMeta(g, series.filter(function (s) { return state.selected.has(s.key); }));
    }

    function renderCharts(history) {
      if (window.__chartFailed || !window.Chart) {
        GROUPS.forEach(function (g) {
          const box = document.getElementById(g.id).parentElement;
          box.innerHTML = '<p class="empty">图表加载失败（离线 / CDN 不可达）</p>';
        });
        return;
      }
      // 清除所有旧占位（从"全不选"状态恢复时必需）
      document.querySelectorAll(".chart-empty").forEach(function (el) { el.remove(); });
      // zoom 插件注册（仅一次）
      if (window.ChartZoom && !window.__zoomFailed && !renderCharts._zoomRegistered) {
        Chart.register(window.ChartZoom);
        renderCharts._zoomRegistered = true;
      }
      GROUPS.forEach(function (g) { renderGroup(g, history); });
    }

    function onGroupClick(idx) {
      const g = GROUPS[idx];
      // 已精确隔离到该组 → 恢复快照；否则快照当前态并仅保留该组
      const isolated = g.keys.every(function (k) { return state.selected.has(k); })
        && state.selected.size === g.keys.length;
      if (isolated) {
        state.selected = state.selSnapshot ? new Set(state.selSnapshot) : new Set(ALL_KEYS);
      } else {
        state.selSnapshot = new Set(state.selected);
        state.selected = new Set(g.keys);
      }
      syncSelection();
    }

    function syncSelection() {
      // 纯客户端同步中枢：图例 / 类别 / 芯片 / 全选清空 的统一入口，不发起网络请求。
      if (!state.history || !state.latest) { refresh(); return; }
      GROUPS.forEach(function (g) {
        const canvas = document.getElementById(g.id);
        const box = canvas.parentElement;
        const series = state.history.series.filter(function (s) {
          return g.keys.indexOf(s.key) !== -1;
        });
        const anySelected = series.some(function (s) { return state.selected.has(s.key); });
        if (charts[g.id]) {
          if (!anySelected) {
            // 整组变空 → destroy + 占位
            charts[g.id].destroy();
            delete charts[g.id];
            canvas.style.display = "none";
            let ph = box.querySelector(".chart-empty");
            if (!ph) {
              ph = document.createElement("p");
              ph.className = "empty chart-empty";
              ph.textContent = "无选中指标";
              box.appendChild(ph);
            }
            const meta = box.querySelector(".chart-meta");
            if (meta) meta.innerHTML = "";
            return;
          }
          // 性能路径：仅改 dataset.hidden + update（无网络请求）
          charts[g.id].data.datasets.forEach(function (ds) {
            ds.hidden = !state.selected.has(ds.key);
          });
          charts[g.id].update();
          renderMeta(g, series.filter(function (s) { return state.selected.has(s.key); }));
        } else {
          // chart 不存在（空组恢复 / 首载后）→ 用缓存重建（hidden 一并应用）
          renderGroup(g, state.history);
        }
      });
      renderOverview(state.latest);  // 概览表复用缓存 latest + 既有 selected 过滤/排序
      renderFilter();  // 刷新类别按钮 / chips / 全选清空 的类
    }

    function renderFilter() {
      // 类别批量按钮（group-bar）
      const gbar = document.getElementById("group-bar");
      gbar.innerHTML = "";
      GROUPS.forEach(function (g, idx) {
        const btn = document.createElement("button");
        btn.type = "button";
        const active = g.keys.every(function (k) { return state.selected.has(k); });
        btn.className = "filter-act" + (active ? " active" : "");
        btn.textContent = g.name;
        btn.dataset.group = String(idx);
        btn.addEventListener("click", function () { onGroupClick(idx); });
        gbar.appendChild(btn);
      });
      // 全选 / 清空 + 指标 chips（symbol-filter）
      const box = document.getElementById("symbol-filter");
      box.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "filter-act";
      allBtn.textContent = "全选";
      allBtn.addEventListener("click", function () {
        state.selected = new Set(ALL_KEYS);
        syncSelection();
      });
      const clearBtn = document.createElement("button");
      clearBtn.type = "button";
      clearBtn.className = "filter-act";
      clearBtn.textContent = "清空";
      clearBtn.addEventListener("click", function () {
        state.selected = new Set();
        syncSelection();
      });
      box.appendChild(allBtn);
      box.appendChild(clearBtn);
      ALL_KEYS.forEach(function (key) {
        const label = document.createElement("label");
        label.className = "chip" + (state.selected.has(key) ? " on" : "");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = state.selected.has(key);
        cb.addEventListener("change", function () {
          if (cb.checked) state.selected.add(key);
          else state.selected.delete(key);
          syncSelection();
        });
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = COLORS[key];
        const text = document.createElement("span");
        text.textContent = SHORT[key] || key;
        label.appendChild(cb);
        label.appendChild(dot);
        label.appendChild(text);
        box.appendChild(label);
      });
    }

    function updateSortIndicators() {
      document.querySelectorAll(".th-sort").forEach(function (th) {
        const ind = th.querySelector(".sort-ind");
        if (!ind) return;
        if (state.sort.key === th.dataset.sort) {
          ind.textContent = state.sort.dir === 1 ? "▲" : "▼";
        } else {
          ind.textContent = "";
        }
      });
    }

    function refresh() {
      // 历史趋势：恒取全量（显隐纯客户端）；写入缓存供 syncSelection 复用
      fetch(buildQuery()).then(function (r) { return r.json(); })
        .then(function (history) {
          state.history = history;
          renderCharts(history);
        })
        .catch(function () { /* 图表区已在渲染函数内降级 */ });
      // 最新概览 + 板块：始终请求（表格按 selected 过滤 + 排序）
      fetch("/api/latest").then(function (r) { return r.json(); })
        .then(function (data) {
          state.latest = data;
          renderOverview(data);
          renderSector(data);
        })
        .catch(function (e) { loadFailed(e.message, "overview-body"); });
    }

    function loadFailed(msg, boxId) {
      const box = document.getElementById(boxId);
      if (box) box.innerHTML = '<tr><td colspan="4">加载失败：' + msg + "</td></tr>";
    }

    document.addEventListener("DOMContentLoaded", function () {
      // 时间范围按钮
      document.getElementById("range-bar").addEventListener("click", function (e) {
        const btn = e.target.closest("button[data-days]");
        if (!btn) return;
        state.days = parseInt(btn.dataset.days, 10);
        document.querySelectorAll("#range-bar button").forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        document.getElementById("range-label").textContent = state.days;
        refresh();
      });
      // 排序表头：升序 → 降序 → 原序 三态循环
      document.querySelectorAll(".th-sort").forEach(function (th) {
        th.addEventListener("click", function () {
          const key = th.dataset.sort;
          if (state.sort.key === key) {
            if (state.sort.dir === 1) state.sort.dir = -1;     // 升 → 降
            else { state.sort.key = null; state.sort.dir = 1; } // 降 → 原序
          } else {
            state.sort.key = key; state.sort.dir = 1;          // 新列 → 升序
          }
          refresh();
        });
      });

      renderFilter();
      refresh();
      // 告警仅初始加载一次（不随筛选/范围变化）
      fetch("/api/alerts").then(function (r) { return r.json(); })
        .then(function (data) { renderAlerts(data); })
        .catch(function () { document.getElementById("alert-list").innerHTML = '<p class="empty">加载失败</p>'; });
    });
  </script>
</body>
</html>
