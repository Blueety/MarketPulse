<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>宏观数据 · MarketPulse</title>
  <script>
    // ⚠️ D1（2026-09-14 macro-page-refine）：**必须"显式应用存储到的主题值"**，而不是只处理 "light"。
    // 原实现只在存储为 light 时写属性，而 <html> 的默认属性就是 light →
    // 存储为 dark 时**没有任何代码把 dark 写回**，用户从首页（深色）进入本页会突然变浅色
    // （macro.js 里虽有 getTheme()，但此前只在"点击切换"时才调用）。
    // ⚠️ 与 macro.js 的 applyTheme() 同口径；改动必须两边同步（docs/pitfalls.md「主题初始化分叉」）。
    (function () {
      try {
        var t = localStorage.getItem("mp-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <!-- 与首页同一份 style.css（宏观页样式追加在同一文件尾部的 .mac-* 段） -->
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          onerror="window.__chartFailed=true"></script>
</head>
<body>
  {% include "_topbar.html" %}
  <div class="shell">
    {% include "_sidebar.html" %}
    <main class="main" id="main">
      <div class="mac">
        <header class="mac-head">
          <h1>宏观数据</h1>
          <p class="mac-sub">经济与市场环境工作台<span class="mac-sep">·</span>数据截至 <span id="macro-asof">—</span></p>
        </header>

        <!-- 一级块：当前宏观环境（**无卡片边框** → 与下方卡片形成层级差；plan §3.2「降卡片感」；
             七个等权卡片是"堆卡片"，这里开始分层：一级=区块、二级=重卡、三/四级=合并卡、五级=弱化卡） -->
        <section class="mac-flat" id="mac-regime">
          <div class="mac-card-head">
            <h2>当前宏观环境</h2>
            <span class="mac-note" id="regime-basis"></span>
          </div>
          <div class="mac-regime">
            <div class="regime-hero">
              <div class="regime-level" id="regime-level">数据暂缺</div>
              <div class="regime-quadrant" id="regime-quadrant"></div>
            </div>
            <div class="regime-score">
              <div class="score-num" id="regime-score">—</div>
              <div class="score-cap">Macro Score</div>
            </div>
            <ul class="regime-factors" id="regime-factors"></ul>
          </div>
        </section>

        <!-- 二级块：宏观市场（**唯一"重"卡片**：主图 = 视觉中心；胶囊切换品种 + 时间范围） -->
        <section class="mac-card mac-card-hero" id="mac-market">
          <div class="mac-card-head">
            <h2>宏观市场</h2>
            <div class="mac-tools">
              <div class="mac-pills" id="macro-pills"></div>
              <div class="mac-pills" id="macro-range"></div>
            </div>
          </div>
          <div class="mac-chart-wrap" id="macro-chart-wrap">
            <canvas id="macro-chart"></canvas>
            <p class="mac-fail hidden" id="macro-chart-fail">图表加载失败</p>
          </div>
          <p class="mac-foot" id="macro-chart-foot"></p>
        </section>

        <!-- 三级块：核心宏观变量 + 宏观因子（**同一卡片内两栏** —— 去掉"卡片套卡片"两层壳，
             消除空转留白 D5/D6；两栏 align-self:start，互不拉伸） -->
        <section class="mac-card" id="mac-metrics">
          <div class="mac-2col">
            <div class="mac-col" id="mac-vars">
              <h3 class="mac-col-title">核心宏观变量<span class="mac-note">状态词按日变化分档</span></h3>
              <div class="mac-vars" id="macro-vars"></div>
            </div>
            <div class="mac-col" id="mac-factors">
              <h3 class="mac-col-title">宏观因子<span class="mac-note">四维度打分（-2 ~ +2）· 影响资产为前端静态映射</span></h3>
              <ul class="mac-factors" id="macro-factors"></ul>
            </div>
          </div>
        </section>

        <!-- 四级块：宏观关系 + 历史环境（同一卡片内两栏；关系**默认只列最强的 2~3 条** + 「查看全部」） -->
        <section class="mac-card mac-card-quiet" id="mac-signals">
          <div class="mac-2col">
            <div class="mac-col" id="mac-relation">
              <h3 class="mac-col-title">宏观关系<span class="mac-note" id="macro-rel-note"></span></h3>
              <ul class="mac-rel" id="macro-rel"></ul>
              <button class="mac-more" type="button" id="macro-rel-more" hidden></button>
            </div>
            <div class="mac-col" id="mac-history">
              <h3 class="mac-col-title">历史宏观环境<span class="mac-note" id="mac-history-note"></span></h3>
              <div class="mac-hist" id="macro-history"></div>
            </div>
          </div>
        </section>

        <!-- 五级块：经济数据（/api/econ，**必须显示数据月份**，不得写「最新/实时」；
             **降低对比度**：更浅底色 + 更弱边框，"这是背景资料"——PRD 要点 8） -->
        <section class="mac-card mac-card-quiet" id="mac-econ">
          <div class="mac-card-head">
            <h2>经济数据</h2>
            <span class="mac-note" id="econ-asof"></span>
          </div>
          <div class="mac-econ" id="macro-econ"></div>
          <p class="mac-foot" id="econ-basis"></p>
        </section>
      </div>
    </main>
  </div>
  <script src="/static/macro.js?v={{ asset_v }}"></script>
</body>
</html>
