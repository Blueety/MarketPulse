# /etc/nginx/conf.d/marketpulse.conf
#
# MarketPulse Web 看板（FastAPI + uvicorn，监听 127.0.0.1:__APP_PORT__）。
# 由 deploy/install-server.sh 渲染安装：替换 __TLS_PORT__ / __APP_PORT__ / __SERVER_NAME__。
#
# 为什么是自签 HTTPS：服务器只有 IP、没有域名/证书，而应用用 HTTP Basic Auth 鉴权
# （凭据只 base64 编码，明文 HTTP 等同泄露）。自签证书保证**传输加密**；
# 代价是浏览器首次访问要点一次「继续前往」（证书是自签的，无法验证身份）。
# 等域名备案下来后换成真证书：把 ssl_certificate 换成签发证书即可，其余不动。
#
# 要点：
#   1) Authorization 头必须透传（nginx 默认透传，**不要**写 proxy_set_header Authorization ""）；
#   2) X-Forwarded-Proto 要设成 https，否则应用生成的绝对 URL 会是 http；
#   3) proxy_read_timeout 给足：AkShare/BLS 取数接口是同步阻塞的，冷启动可能十几秒。

server {
    # ⚠️ nginx < 1.25.1（Ubuntu 24.04 是 1.24）**不认识**独立的 `http2 on;` 指令，
    #    必须在 listen 上带参数：`listen ... ssl http2;`（实测报 unknown directive "http2"）。
    #    nginx ≥ 1.25.1 也仍接受这种写法（只是标记为旧式）。
    listen      __TLS_PORT__ ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/ssl/marketpulse.crt;
    ssl_certificate_key /etc/nginx/ssl/marketpulse.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    charset       utf-8;
    server_tokens off;

    # 看板接口返回 JSON / HTML，gzip 收益中等；静态资源走 /static（应用自己发）
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;

    location / {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;   # 预留 WebSocket
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}

# 等域名 + ICP 备案 + 真证书齐了之后：
#   1) 上面 listen 改 80、server_name 改域名，ssl 三行换成真证书路径；
#   2) 再加一个 80 → 443 的 301 跳转 server 块；
#   3) 删发行版默认站点（Debian/Ubuntu: rm -f /etc/nginx/sites-enabled/default）；
#   4) 若前端连 Supabase：Dashboard → Authentication → URL Configuration 加新域名。
